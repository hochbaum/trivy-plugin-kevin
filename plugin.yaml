name: kevin
version: 0.0.1
repository: github.com/hochbaum/trivy-plugin-kevin
maintainer: Linus Hochbaum
output: true
summary: |-
  This Trivy plugin allows you to enrich the scan result
  with data from the Known Exploited Vulnerability (KEV)
  database.

platforms:
  - selector:
      os: linux
      arch: amd64
    uri: ./trivy-plugin-kevin
    bin: ./trivy-plugin-kevin